<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REFIT MASTER DOCS v10.3A</title>
<style>
body{font-family:Arial;margin:0;background:#fff7f5;color:#31424a}
.header{background:#c98b8b;color:#fff;padding:18px;text-align:center;font-size:28px;font-weight:bold}
.container{padding:12px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;border:none;border-radius:12px;background:#8fb7b6;color:#fff;font-size:16px;margin-top:6px}
.card{background:#fff;padding:16px;border-radius:16px;margin-top:14px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.hidden{display:none}
input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-size:16px}
.item{background:#fff1ed;padding:10px;border-radius:10px;margin-top:8px;line-height:1.5}
.danger{background:#d98c8c}
.total{text-align:right;font-size:20px;font-weight:bold}
#printArea{display:none;background:white;color:#222;padding:28px;font-size:13px}
#printTitle{text-align:center;font-size:26px;font-weight:bold;letter-spacing:8px;text-transform:lowercase;margin-bottom:12px}
#printCompany{text-align:center;line-height:1.5;margin-bottom:18px}
#printMeta{text-align:right;font-size:12px;margin-bottom:16px}
#printInfo{line-height:1.6;margin-bottom:16px}
#printArea table{width:100%;border-collapse:collapse;font-size:12px}
#printArea th,#printArea td{border:1px solid #999;padding:6px;vertical-align:top}
#printTotal{text-align:right;font-size:18px;font-weight:bold;margin-top:16px}
#printTerms{line-height:1.6;margin-top:24px}
@media print{
body *{visibility:hidden}
#printArea,#printArea *{visibility:visible}
#printArea{display:block;position:absolute;left:0;top:0;width:100%;box-sizing:border-box}
}
</style>
</head>
<body>

<div class="header">REFIT MASTER DOCS</div>

<div class="container">

<div class="menu">
<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('company')">Company</button>
<button onclick="showPage('projects')">Projects</button>
<button onclick="showPage('prices')">Price Master</button>
<button onclick="showPage('quotes')">Quotations</button>
<button onclick="showPage('invoices')">Invoices</button>
<button onclick="showPage('receipts')">Receipts</button>
</div>

<div id="dashboard" class="card">
<h2>Dashboard</h2>
<div id="stats"></div>
</div>

<div id="company" class="card hidden">
<h2>Company Profile</h2>
<input id="companyName" placeholder="Company Name">
<textarea id="companyAddress" placeholder="Company Address"></textarea>
<input id="companySSM" placeholder="SSM / Registration No">
<input id="companyPhone" placeholder="Phone">
<input id="companyEmail" placeholder="Email">
<textarea id="companyBank" placeholder="Bank Details"></textarea>
<input id="companySign" placeholder="Authorized Person">
<button onclick="saveCompany()">Save Company</button>
<div id="companyPreview"></div>
</div>

<div id="projects" class="card hidden">
<h2>Projects</h2>
<input id="projectName" placeholder="Client Name">
<textarea id="projectAddress" placeholder="Address"></textarea>
<input id="projectRef" placeholder="Job Title / Ref">
<input id="projectPhone" placeholder="Phone">
<input id="projectEmail" placeholder="Email">
<button onclick="saveProject()">Save Project</button>
<div id="projectList"></div>
</div>

<div id="prices" class="card hidden">
<h2>Price Master</h2>
<input id="priceDesc" placeholder="Description">
<input id="priceUnit" placeholder="Unit e.g. lot, nos, sf">
<input id="priceRate" type="number" placeholder="Rate">
<button onclick="savePrice()">Save Price</button>
<div id="priceList"></div>
</div>

<div id="quotes" class="card hidden">
<h2>Quotation</h2>

<select id="quoteProject"></select>
<select id="quotePrice"></select>
<input id="quoteQty" type="number" placeholder="Qty">

<button onclick="addQuoteItem()">Add Item</button>

<div id="quoteItems"></div>

<h3 class="total">Total RM <span id="quoteTotal">0.00</span></h3>

<button onclick="saveQuotation()">Save Quotation</button>
<button onclick="printCurrentQuotation()">Print Current Quotation</button>

<h3>Saved Quotations</h3>
<div id="quotationList"></div>

<h3>View Saved Quotation</h3>
<select id="viewQuoteSelect"></select>
<button onclick="viewSavedQuotation()">View Selected Quotation</button>
<button onclick="printViewedQuotation()">Print Viewed Quotation</button>
<div id="viewQuoteBox" class="item">Select a saved quotation and tap View Selected Quotation.</div>
</div>


<div id="invoices" class="card hidden">
<h2>Invoices</h2>
<select id="invoiceQuotation"></select>
<button onclick="generateInvoices()">Generate Progress Invoices 30/40/25/5</button>

<h3>Invoice List</h3>
<div id="invoiceList"></div>

<h3>Print Invoice</h3>
<select id="printInvoiceSelect"></select>
<button onclick="printSelectedInvoice()">Print Selected Invoice</button>
</div>

<div id="receipts" class="card hidden">
<h2>Receipts</h2>
<select id="receiptInvoice"></select>
<input id="receiptAmount" type="number" placeholder="Paid Amount RM">
<input id="receiptDate" type="date">
<select id="paymentMethod">
<option>Cash</option>
<option>Bank Transfer</option>
<option>Cheque</option>
<option>Online Payment</option>
</select>
<button onclick="saveReceipt()">Save Receipt</button>

<h3>Receipt List</h3>
<div id="receiptList"></div>

<h3>Print Receipt</h3>
<select id="printReceiptSelect"></select>
<button onclick="printSelectedReceipt()">Print Selected Receipt</button>
</div>

</div>

<div id="printArea">
<div id="printTitle">q u o t a t i o n</div>
<div id="printCompany"></div>
<div id="printMeta"></div>
<div id="printInfo"></div>
<div id="printTable"></div>
<div id="printTotal"></div>
<div id="printTerms"></div>
</div>

<script>
let company=JSON.parse(localStorage.getItem("company")||'{"name":"REFIT MAINTENANCE SERVICES","address":"C-08-34 centum @ oasis corporate park, oasis damansara, No.2, jalan pju 1a/2, ara damansara, 47301 petaling jaya.","ssm":"201803348973","phone":"","email":"","bank":"RHB BANK A/C: 2126 1100 0235 58","sign":"Lyode ng"}');
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
let prices=JSON.parse(localStorage.getItem("prices")||"[]");
let quotations=JSON.parse(localStorage.getItem("quotations")||"[]");
let invoices=JSON.parse(localStorage.getItem("invoices")||"[]");
let receipts=JSON.parse(localStorage.getItem("receipts")||"[]");
let currentQuote=[];
let viewedQuoteIndex=null;

function money(n){return (Number(n)||0).toFixed(2);}

function getQuoteClient(q){
if(!q)return "No Client";
if(q.project && q.project.name)return q.project.name;
if(q.project && q.project.client)return q.project.client;
if(q.client)return q.client;
return "No Client";
}

function getQuoteAddress(q){
if(q && q.project && q.project.address)return q.project.address;
if(q && q.address)return q.address;
return "";
}

function getQuoteRef(q){
if(q && q.project && q.project.ref)return q.project.ref;
if(q && q.ref)return q.ref;
return "";
}

function getQuoteItems(q){
if(q && Array.isArray(q.items))return q.items;
return [];
}

function getQuoteTotal(q){
if(!q)return 0;
return Number(q.total || q.grandTotal || 0);
}



function showPage(id){
["dashboard","company","projects","prices","quotes","invoices","receipts"].forEach(p=>document.getElementById(p).classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
refresh();
}

function saveCompany(){
company={
name:companyName.value,
address:companyAddress.value,
ssm:companySSM.value,
phone:companyPhone.value,
email:companyEmail.value,
bank:companyBank.value,
sign:companySign.value
};
localStorage.setItem("company",JSON.stringify(company));
refresh();
alert("Company saved");
}

function loadCompany(){
companyName.value=company.name||"";
companyAddress.value=company.address||"";
companySSM.value=company.ssm||"";
companyPhone.value=company.phone||"";
companyEmail.value=company.email||"";
companyBank.value=company.bank||"";
companySign.value=company.sign||"";
}

function saveProject(){
projects.push({
name:projectName.value,
address:projectAddress.value,
ref:projectRef.value,
phone:projectPhone.value,
email:projectEmail.value
});
localStorage.setItem("projects",JSON.stringify(projects));
projectName.value="";
projectAddress.value="";
projectRef.value="";
projectPhone.value="";
projectEmail.value="";
refresh();
}

function deleteProject(i){
if(confirm("Delete project?")){
projects.splice(i,1);
localStorage.setItem("projects",JSON.stringify(projects));
refresh();
}
}

function savePrice(){
prices.push({
desc:priceDesc.value,
unit:priceUnit.value||"lot",
rate:parseFloat(priceRate.value)||0
});
localStorage.setItem("prices",JSON.stringify(prices));
priceDesc.value="";
priceUnit.value="";
priceRate.value="";
refresh();
}

function deletePrice(i){
if(confirm("Delete price item?")){
prices.splice(i,1);
localStorage.setItem("prices",JSON.stringify(prices));
refresh();
}
}

function addQuoteItem(){
let p=prices[quotePrice.value];
let qty=parseFloat(quoteQty.value)||0;
if(!p){alert("Add price item first");return;}
currentQuote.push({
desc:p.desc,
unit:p.unit,
rate:p.rate,
qty:qty,
amount:p.rate*qty
});
quoteQty.value="";
renderQuote();
}

function removeCurrentQuoteItem(i){
currentQuote.splice(i,1);
renderQuote();
}

function renderQuote(){
let total=0;
quoteItems.innerHTML=currentQuote.map((i,index)=>{
total+=i.amount;
return `<div class="item">
<b>${index+1}. ${i.desc}</b><br>
Unit: ${i.unit}<br>
Qty: ${i.qty}<br>
Rate: RM ${money(i.rate)}<br>
Amount: RM ${money(i.amount)}<br>
<button class="danger" onclick="removeCurrentQuoteItem(${index})">Remove</button>
</div>`;
}).join("");
quoteTotal.innerText=money(total);
}

function saveQuotation(){
let project=projects[quoteProject.value];
if(!project){alert("Select project");return;}
if(currentQuote.length===0){alert("Add quotation item");return;}
let total=currentQuote.reduce((s,i)=>s+i.amount,0);
let qNo="Q-"+String(quotations.length+1).padStart(3,"0");
quotations.push({
quoteNo:qNo,
project:project,
items:[...currentQuote],
total:total,
date:new Date().toLocaleDateString()
});
localStorage.setItem("quotations",JSON.stringify(quotations));
currentQuote=[];
renderQuote();
refresh();
alert("Quotation saved");
}

function deleteQuotation(i){
if(confirm("Delete quotation?")){
quotations.splice(i,1);
localStorage.setItem("quotations",JSON.stringify(quotations));
refresh();
}
}

function companyHeader(){
return `<b>${company.name||"REFIT MAINTENANCE SERVICES"}</b><br>
${company.ssm||""}<br>
${company.address||""}<br>
${company.phone?company.phone+" ":""}${company.email||""}`;
}

function printQuotation(q){
printTitle.innerHTML="q u o t a t i o n";
printCompany.innerHTML=companyHeader();
printMeta.innerHTML=`quotation no : ${q.quoteNo||"DRAFT"}<br>date : ${q.date||new Date().toLocaleDateString()}`;
printInfo.innerHTML=`<b>attention to</b><br>
${q.project.name||""}<br>
${q.project.address||""}<br><br>
<b>Job Title</b><br>
${q.project.ref||""}`;

printTable.innerHTML=`<table>
<thead><tr><th>no</th><th>description</th><th>unit</th><th>qty</th><th>rate</th><th>amount(RM)</th></tr></thead>
<tbody>
${q.items.map((it,i)=>`<tr>
<td>${i+1}</td>
<td>${it.desc}</td>
<td>${it.unit}</td>
<td>${it.qty}</td>
<td>${money(it.rate)}</td>
<td>${money(it.amount)}</td>
</tr>`).join("")}
</tbody>
</table>`;

printTotal.innerHTML=`TOTAL RENOVATION WORKS : RM${money(getQuoteTotal(q))}`;

printTerms.innerHTML=`<b>terms and condition:</b><br>
~ payment 30% upon confirmation. Progress claim 65% and balance 5% after completion.<br>
~ prices valid for 30 working days from date of quotation<br>
~ warranty / defects liability period 12 mths upon site handover<br>
~ goods sold are not returnable or exchangeable<br><br>
All cheques / or bank transfer should be payable to :-<br>
<b>${company.bank||""}</b><br><br>
I/we hereby confirm & accept the above quotation in full<br><br>
customer name : ___________________________<br>
customer i/c or company chop n sign : ___________________________<br><br>
Yours sincerely,<br>
FOR . ${company.name||"REFIT MAINTENANCE SERVICES"}`;

window.print();
}

function printCurrentQuotation(){
let project=projects[quoteProject.value];
if(!project || currentQuote.length===0){alert("Select project and add item");return;}
let total=currentQuote.reduce((s,i)=>s+i.amount,0);
printQuotation({quoteNo:"DRAFT",project:project,items:currentQuote,total:total,date:new Date().toLocaleDateString()});
}

function printSavedQuotation(i){
var q=quotations[i];
if(!q)return;
printQuotation({
quoteNo:q.quoteNo||("Q-"+(i+1)),
project:{name:getQuoteClient(q),address:getQuoteAddress(q),ref:getQuoteRef(q)},
items:getQuoteItems(q),
total:getQuoteTotal(q),
date:q.date||new Date().toLocaleDateString()
});
});
}




function buildQuoteOptions(){
var html="";
for(var i=0;i<quotations.length;i++){
var q=quotations[i]||{};
html += "<option value='"+i+"'>"+(q.quoteNo||("Q-"+(i+1)))+" - "+getQuoteClient(q)+" - RM "+money(getQuoteTotal(q))+"</option>";
}
return html;
}


function viewSavedQuotation(){
var sel=document.getElementById("viewQuoteSelect");
if(!sel){alert("Viewer selector missing");return;}
var idx=parseInt(sel.value,10);
if(isNaN(idx)){alert("No quotation selected");return;}
viewedQuoteIndex=idx;
var q=quotations[idx];
if(!q){alert("No quotation found");return;}

var items=getQuoteItems(q);
var rows="";
for(var i=0;i<items.length;i++){
var it=items[i]||{};
var qty=Number(it.qty||0);
var rate=Number(it.rate||0);
var amount=Number(it.amount||qty*rate);
rows += "<tr>"+
"<td>"+(i+1)+"</td>"+
"<td>"+(it.desc||"")+"</td>"+
"<td>"+(it.unit||"")+"</td>"+
"<td>"+qty+"</td>"+
"<td>RM "+money(rate)+"</td>"+
"<td>RM "+money(amount)+"</td>"+
"</tr>";
}

document.getElementById("viewQuoteBox").innerHTML =
"<div class='item'>"+
"<b>"+(q.quoteNo||("Q-"+(idx+1)))+"</b><br>"+
"Client: "+getQuoteClient(q)+"<br>"+
"Address: "+getQuoteAddress(q)+"<br>"+
"Job Title: "+getQuoteRef(q)+"<br>"+
"Date: "+(q.date||"")+"<br>"+
"Total: <b>RM "+money(getQuoteTotal(q))+"</b>"+
"</div>"+
"<table style='width:100%;border-collapse:collapse;margin-top:10px'>"+
"<thead><tr><th>No</th><th>Description</th><th>Unit</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>"+
"<tbody>"+rows+"</tbody></table>";
}

function printViewedQuotation(){
if(viewedQuoteIndex===null){alert("View quotation first");return;}
var q=quotations[viewedQuoteIndex];
if(!q){alert("No quotation selected");return;}
printQuotation({
quoteNo:q.quoteNo||("Q-"+(viewedQuoteIndex+1)),
project:{name:getQuoteClient(q),address:getQuoteAddress(q),ref:getQuoteRef(q)},
items:getQuoteItems(q),
total:getQuoteTotal(q),
date:q.date||new Date().toLocaleDateString()
});
}

function generateInvoices(){
let q=quotations[invoiceQuotation.value];
if(!q){alert("Select quotation first");return;}
if(invoices.some(inv=>inv.quoteNo===q.quoteNo)){alert("Invoices already generated for this quotation");return;}
let stages=[
{stage:"INV-1",percent:30},
{stage:"INV-2",percent:40},
{stage:"INV-3",percent:25},
{stage:"INV-4",percent:5}
];
stages.forEach(s=>{
let amount=q.total*s.percent/100;
invoices.push({
invoiceNo:s.stage+"-"+String(invoices.length+1).padStart(3,"0"),
quoteNo:q.quoteNo,
client:q.project.name,
projectRef:q.project.ref||"",
stage:s.stage,
percent:s.percent,
amount:amount,
paid:0,
balance:amount,
status:"Pending",
date:new Date().toLocaleDateString()
});
});
localStorage.setItem("invoices",JSON.stringify(invoices));
refresh();
alert("Invoices generated");
}

function editInvoice(i){
let inv=invoices[i];
let amt=prompt("Edit invoice amount",inv.amount);
if(amt===null)return;
amt=parseFloat(amt)||0;
inv.amount=amt;
if(inv.paid>amt)inv.paid=amt;
inv.balance=Math.max(0,amt-inv.paid);
inv.status=inv.balance<=0?"Paid":(inv.paid>0?"Partial":"Pending");
localStorage.setItem("invoices",JSON.stringify(invoices));
refresh();
}

function deleteInvoice(i){
if(!confirm("Delete invoice and related receipts?"))return;
let invNo=invoices[i].invoiceNo;
receipts=receipts.filter(r=>r.invoiceNo!==invNo);
invoices.splice(i,1);
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("receipts",JSON.stringify(receipts));
refresh();
}

function saveReceipt(){
let inv=invoices[receiptInvoice.value];
if(!inv){alert("Select invoice first");return;}
let paid=parseFloat(receiptAmount.value)||0;
if(paid<=0){alert("Enter paid amount");return;}
let receiptNo="RCPT-"+String(receipts.length+1).padStart(3,"0");
inv.paid=(Number(inv.paid)||0)+paid;
inv.balance=Math.max(0,(Number(inv.amount)||0)-inv.paid);
inv.status=inv.balance<=0?"Paid":"Partial";
receipts.push({
receiptNo:receiptNo,
invoiceNo:inv.invoiceNo,
client:inv.client,
amount:paid,
date:receiptDate.value||new Date().toLocaleDateString(),
method:paymentMethod.value,
balance:inv.balance
});
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("receipts",JSON.stringify(receipts));
receiptAmount.value="";
refresh();
alert("Receipt saved");
}

function editReceipt(i){
let r=receipts[i];
let amt=prompt("Edit receipt amount",r.amount);
if(amt===null)return;
amt=parseFloat(amt)||0;
let inv=invoices.find(x=>x.invoiceNo===r.invoiceNo);
if(inv){
inv.paid=(Number(inv.paid)||0)-(Number(r.amount)||0)+amt;
if(inv.paid<0)inv.paid=0;
inv.balance=Math.max(0,(Number(inv.amount)||0)-inv.paid);
inv.status=inv.balance<=0?"Paid":(inv.paid>0?"Partial":"Pending");
r.balance=inv.balance;
}
r.amount=amt;
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("receipts",JSON.stringify(receipts));
refresh();
}

function deleteReceipt(i){
if(!confirm("Delete receipt?"))return;
let r=receipts[i];
let inv=invoices.find(x=>x.invoiceNo===r.invoiceNo);
if(inv){
inv.paid=(Number(inv.paid)||0)-(Number(r.amount)||0);
if(inv.paid<0)inv.paid=0;
inv.balance=Math.max(0,(Number(inv.amount)||0)-inv.paid);
inv.status=inv.balance<=0?"Paid":(inv.paid>0?"Partial":"Pending");
}
receipts.splice(i,1);
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("receipts",JSON.stringify(receipts));
refresh();
}

function printInvoice(inv){
printTitle.innerHTML="i n v o i c e";
printCompany.innerHTML=companyHeader();
printMeta.innerHTML=`invoice no : ${inv.invoiceNo}<br>quotation no : ${inv.quoteNo}<br>date : ${inv.date}`;
printInfo.innerHTML=`<b>attention to</b><br>${inv.client}<br><br><b>Job Title</b><br>${inv.projectRef||""}`;
printTable.innerHTML=`<table>
<thead><tr><th>no</th><th>description</th><th>amount</th></tr></thead>
<tbody>
<tr><td>1</td><td>TOTAL RENOVATION</td><td>RM ${money(inv.amount)}</td></tr>
<tr><td></td><td>${inv.stage} PROGRESS CLAIM : ${inv.percent}%</td><td>RM ${money(inv.amount)}</td></tr>
<tr><td></td><td>PAID</td><td>RM ${money(inv.paid)}</td></tr>
<tr><td></td><td><b>BALANCE :</b></td><td><b>RM ${money(inv.balance)}</b></td></tr>
</tbody>
</table>`;
printTotal.innerHTML=`${inv.stage} PROGRESS CLAIM : RM ${money(inv.amount)}<br>BALANCE : RM ${money(inv.balance)}`;
printTerms.innerHTML=`All cheques / or bank transfers should be payable to <b>${company.name||"REFIT MAINTENANCE SERVICES"}</b><br>${company.bank||""}<br><br>Yours sincerely,<br>FOR . ${company.name||"REFIT MAINTENANCE SERVICES"}`;
window.print();
}

function printSelectedInvoice(){
let inv=invoices[printInvoiceSelect.value];
if(!inv){alert("Select invoice");return;}
printInvoice(inv);
}

function printReceipt(r){
printTitle.innerHTML="o f f i c i a l  r e c e i p t";
printCompany.innerHTML=companyHeader();
printMeta.innerHTML=`receipt no : ${r.receiptNo}<br>inv no : ${r.invoiceNo}<br>date : ${r.date}`;
printInfo.innerHTML=`<b>attention to</b><br>${r.client}<br><br><b>PAID FOR PROGRESS CLAIM</b><br>${r.invoiceNo}<br><br><b>PAYMENT BY CHEQUE NO / TRANSFER FROM / SLIP NO:</b><br>${r.method}`;
printTable.innerHTML=`<table>
<thead><tr><th>DATE</th><th>PYMT AMOUNT</th></tr></thead>
<tbody>
<tr><td>${r.date}</td><td>RM ${money(r.amount)}</td></tr>
<tr><td><b>TOTAL</b></td><td><b>RM ${money(r.amount)}</b></td></tr>
</tbody>
</table>`;
printTotal.innerHTML=`RECEIVED THE SUM OF : RINGGIT MALAYSIA RM ${money(r.amount)}`;
printTerms.innerHTML=`N.B. VALIDITY OF THIS RECEIPT SUBJECT TO CLEARING OF TRANSFER<br><br>Yours sincerely,<br>FOR . ${company.name||"REFIT MAINTENANCE SERVICES"}`;
window.print();
}

function printSelectedReceipt(){
let r=receipts[printReceiptSelect.value];
if(!r){alert("Select receipt");return;}
printReceipt(r);
}


function refresh(){
stats.innerHTML=`Projects: ${projects.length}<br>Price Items: ${prices.length}<br>Quotations: ${quotations.length}<br>Invoices: ${invoices.length}<br>Receipts: ${receipts.length}`;

loadCompany();

companyPreview.innerHTML=`<div class="item">${companyHeader()}<br><br><b>Bank:</b><br>${company.bank||""}<br><br><b>Authorized:</b> ${company.sign||""}</div>`;

projectList.innerHTML=projects.map((p,i)=>`<div class="item">
<b>${p.name}</b><br>
${p.address}<br>
Ref: ${p.ref||""}<br>
<button class="danger" onclick="deleteProject(${i})">Delete</button>
</div>`).join("");

priceList.innerHTML=prices.map((p,i)=>`<div class="item">
${p.desc}<br>
Unit: ${p.unit}<br>
RM ${money(p.rate)}<br>
<button class="danger" onclick="deletePrice(${i})">Delete</button>
</div>`).join("");

quoteProject.innerHTML=projects.map((p,i)=>`<option value="${i}">${p.name}</option>`).join("");

quotePrice.innerHTML=prices.map((p,i)=>`<option value="${i}">${p.desc} - RM ${money(p.rate)}</option>`).join("");

quotationList.innerHTML=quotations.map((q,i)=>`<div class="item">
<b>${q.quoteNo}</b><br>
Client: ${getQuoteClient(q)}<br>
Total: RM ${money(getQuoteTotal(q))}<br>
<button onclick="printSavedQuotation(${i})">Print</button>
<button class="danger" onclick="deleteQuotation(${i})">Delete</button>
</div>`).join("");

if(document.getElementById("viewQuoteSelect")){viewQuoteSelect.innerHTML=buildQuoteOptions();}

if(document.getElementById("invoiceQuotation")){invoiceQuotation.innerHTML=buildQuoteOptions();}

invoiceList.innerHTML=invoices.map((inv,i)=>`<div class="item">
<b>${inv.invoiceNo}</b><br>
Client: ${inv.client}<br>
Quotation: ${inv.quoteNo}<br>
Stage: ${inv.stage} (${inv.percent}%)<br>
Amount: RM ${money(inv.amount)}<br>
Paid: RM ${money(inv.paid)}<br>
Balance: RM ${money(inv.balance)}<br>
Status: <b>${inv.status}</b><br>
<button onclick="editInvoice(${i})">Edit</button>
<button class="danger" onclick="deleteInvoice(${i})">Delete</button>
</div>`).join("");

receiptInvoice.innerHTML=invoices.map((inv,i)=>`<option value="${i}">${inv.invoiceNo} - ${inv.client} - Balance RM ${money(inv.balance)}</option>`).join("");

printInvoiceSelect.innerHTML=invoices.map((inv,i)=>`<option value="${i}">${inv.invoiceNo} - ${inv.client}</option>`).join("");

receiptList.innerHTML=receipts.map((r,i)=>`<div class="item">
<b>${r.receiptNo}</b><br>
Invoice: ${r.invoiceNo}<br>
Client: ${r.client}<br>
Paid: RM ${money(r.amount)}<br>
Method: ${r.method}<br>
Date: ${r.date}<br>
Balance After Payment: RM ${money(r.balance)}<br>
<button onclick="editReceipt(${i})">Edit</button>
<button class="danger" onclick="deleteReceipt(${i})">Delete</button>
</div>`).join("");

printReceiptSelect.innerHTML=receipts.map((r,i)=>`<option value="${i}">${r.receiptNo} - ${r.client} - RM ${money(r.amount)}</option>`).join("");
}

refresh();
</script>
