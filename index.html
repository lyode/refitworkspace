function setTheme(name){
let t=themes[name];
if(!t)return;
Object.keys(t).forEach(key=>{
document.documentElement.style.setProperty("--"+key,t[key]);
});
localStorage.setItem("refit_theme",name);
}

function loadSavedTheme(){
setTheme(localStorage.getItem("refit_theme")||"coral");
}

function showPage(page){
["dashboardPage","themePage","companyPage","projectPage","pricePage","quotationPage","invoicePage","receiptPage","backupPage"].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});
document.getElementById(page).classList.remove("hidden");
refreshAll();
}

function money(n){
return (Number(n)||0).toFixed(2);
}

document.getElementById("companyLogo").addEventListener("change",function(e){
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(event){
logoPreview.src=event.target.result;
};
reader.readAsDataURL(file);
});

function saveCompany(){
company={
name:companyName.value,
address:companyAddress.value,
ssm:companySSM.value,
phone:companyPhone.value,
email:companyEmail.value,
bank:companyBank.value,
sign:companySign.value,
logo:logoPreview.src||""
};
localStorage.setItem("company",JSON.stringify(company));
alert("Company Profile Saved");
refreshAll();
}

function loadCompanyForm(){
companyName.value=company.name||"";
companyAddress.value=company.address||"";
companySSM.value=company.ssm||"";
companyPhone.value=company.phone||"";
companyEmail.value=company.email||"";
companyBank.value=company.bank||"";
companySign.value=company.sign||"";
if(company.logo){logoPreview.src=company.logo;}
}

function companyHeader(){
let logo=company.logo?`<div style="text-align:center;margin-bottom:10px;"><img src="${company.logo}" style="max-width:120px;max-height:120px;"></div>`:"";
return `${logo}<b style="font-size:20px">${company.name||"REFIT MASTER DOCS"}</b><br>${company.address||""}<br>${company.ssm?"SSM: "+company.ssm+"<br>":""}${company.phone?"Tel: "+company.phone+" | ":""}${company.email?"Email: "+company.email:""}`;
}

function preparePrintBase(){
printCompany.innerHTML=companyHeader();
printSign.innerHTML=company.sign||"";
printFooter.innerHTML=company.bank?"<b>Bank Details:</b><br>"+company.bank.replace(/\n/g,"<br>"):"";
}
