<script>

/* =========================
   GLOBAL DATA
========================= */

let currentTheme = "editorial";

let companyData = {
  name: "refit workspace",
  phone: "",
  email: "",
  address: ""
};

let quoteItems = [];

let quoteData = {
  client: "",
  project: "",
  address: "",
  remark: "",
  payment: "",
  terms: "",
  subtotal: 0,
  revised: 0
};


/* =========================
   ADD ITEM
========================= */

function addItem(){

  let item = {
    desc: "",
    qty: 1,
    unit: "nos",
    rate: 0,
    amount: 0,
    omitted:false
  };

  quoteItems.push(item);

  renderItems();
}


/* =========================
   RENDER ITEMS
========================= */

function renderItems(){

  let html = "";

  quoteItems.forEach((item,index)=>{

    item.amount = item.qty * item.rate;

    html += `

    <tr class="${item.omitted ? 'omit-row':''}">

      <td>${index+1}</td>

      <td>
        <textarea
          onchange="updateDesc(${index},this.value)"
        >${item.desc}</textarea>
      </td>

      <td>
        <input
          type="number"
          value="${item.qty}"
          onchange="updateQty(${index},this.value)"
        >
      </td>

      <td>
        <input
          value="${item.unit}"
          onchange="updateUnit(${index},this.value)"
        >
      </td>

      <td>
        <input
          type="number"
          value="${item.rate}"
          onchange="updateRate(${index},this.value)"
        >
      </td>

      <td>
        RM ${item.amount.toFixed(2)}
      </td>

      <td>
        <button onclick="omitItem(${index})">
          ${item.omitted ? 'RESTORE':'OMIT'}
        </button>
      </td>

    </tr>

    `;
  });

  document.getElementById("itemBody").innerHTML = html;

  calculateTotals();
}


/* =========================
   UPDATE FUNCTIONS
========================= */

function updateDesc(i,val){
  quoteItems[i].desc = val;
}

function updateQty(i,val){
  quoteItems[i].qty = parseFloat(val)||0;
  renderItems();
}

function updateUnit(i,val){
  quoteItems[i].unit = val;
}

function updateRate(i,val){
  quoteItems[i].rate = parseFloat(val)||0;
  renderItems();
}


/* =========================
   OMIT ITEM
========================= */

function omitItem(i){

  quoteItems[i].omitted =
  !quoteItems[i].omitted;

  renderItems();
}


/* =========================
   CALCULATE TOTALS
========================= */

function calculateTotals(){

  let subtotal = 0;
  let revised = 0;

  quoteItems.forEach(item=>{

    if(item.omitted){
      revised -= item.amount;
    }else{
      subtotal += item.amount;
    }

  });

  quoteData.subtotal = subtotal;
  quoteData.revised = subtotal + revised;

  document.getElementById("subtotal").innerHTML =
  "RM " + subtotal.toFixed(2);

  document.getElementById("revisedTotal").innerHTML =
  "RM " + quoteData.revised.toFixed(2);

}


/* =========================
   SAVE QUOTE
========================= */

function saveQuote(){

  let data = {
    companyData,
    quoteData,
    quoteItems
  };

  localStorage.setItem(
    "refit_quote",
    JSON.stringify(data)
  );

  alert("Quotation Saved");

}


/* =========================
   LOAD QUOTE
========================= */

function loadQuote(){

  let saved =
  localStorage.getItem("refit_quote");

  if(!saved){
    alert("No saved quote");
    return;
  }

  let data = JSON.parse(saved);

  companyData = data.companyData;
  quoteData = data.quoteData;
  quoteItems = data.quoteItems;

  renderItems();

  alert("Quotation Loaded");

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle("darkMode");

}


/* =========================
   THEME SWITCHER
========================= */

function setTheme(theme){

  currentTheme = theme;

  document.body.className = "";

  document.body.classList.add(theme);

}


/* =========================
   PDF PRINT
========================= */

function printQuote(){

  window.print();

}


/* =========================
   START
========================= */

window.onload = function(){

  addItem();

};

</script>
