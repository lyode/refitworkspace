let company=JSON.parse(localStorage.getItem("company"))||{name:"REFIT MASTER DOCS",address:"",ssm:"",phone:"",email:"",bank:"",sign:"",logo:""};
let projects=JSON.parse(localStorage.getItem("projects"))||[];
let prices=JSON.parse(localStorage.getItem("prices"))||[];
let quotations=JSON.parse(localStorage.getItem("quotations"))||[];
let invoices=JSON.parse(localStorage.getItem("invoices"))||[];
let receipts=JSON.parse(localStorage.getItem("receipts"))||[];

let currentQuoteItems=[];
let loadedQuoteIndex=null;
let loadedQuoteItems=[];

function setTheme(name){
let t=themes[name];
if(!t)return;
Object.keys(t).forEach(key=>{
document.documentElement.style.setProperty("--"+key,t[key]);
});
localStorage.setItem("refit_theme",name);
}

function loadSavedTheme(){
setTheme(localStorage.getItem("refit_theme")||"coral");
}

function showPage(page){
["dashboardPage","themePage","companyPage","projectPage","pricePage","quotationPage","invoicePage","receiptPage","backupPage"].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});
document.getElementById(page).classList.remove("hidden");
refreshAll();
}

function money(n){
return (Number(n)||0).toFixed(2);
}

document.getElementById("companyLogo").addEventListener("change",function(e){
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(event){
logoPreview.src=event.target.result;
};
reader.readAsDataURL(file);
});

function saveCompany(){
company={
name:companyName.value,
address:companyAddress.value,
ssm:companySSM.value,
phone:companyPhone.value,
email:companyEmail.value,
bank:companyBank.value,
sign:companySign.value,
logo:logoPreview.src||""
};
localStorage.setItem("company",JSON.stringify(company));
alert("Company Profile Saved");
refreshAll();
}

function loadCompanyForm(){
companyName.value=company.name||"";
companyAddress.value=company.address||"";
companySSM.value=company.ssm||"";
companyPhone.value=company.phone||"";
companyEmail.value=company.email||"";
companyBank.value=company.bank||"";
companySign.value=company.sign||"";
if(company.logo){logoPreview.src=company.logo;}
}

function companyHeader(){
let logo=company.logo?`<div style="text-align:center;margin-bottom:10px;"><img src="${company.logo}" style="max-width:120px;max-height:120px;"></div>`:"";
return `${logo}<b style="font-size:20px">${company.name||"REFIT MASTER DOCS"}</b><br>${company.address||""}<br>${company.ssm?"SSM: "+company.ssm+"<br>":""}${company.phone?"Tel: "+company.phone+" | ":""}${company.email?"Email: "+company.email:""}`;
}

function preparePrintBase(){
printCompany.innerHTML=companyHeader();
printSign.innerHTML=company.sign||"";
printFooter.innerHTML=company.bank?"<b>Bank Details:</b><br>"+company.bank.replace(/\n/g,"<br>"):"";
}
function saveProject(){
let i=editProjectIndex.value;
let obj={client:clientName.value,address:projectAddress.value,phone:phone.value,email:email.value,ref:quoteRef.value,date:projectDate.value,status:projectStatus.value};
i===""?projects.push(obj):projects[i]=obj;
localStorage.setItem("projects",JSON.stringify(projects));
clearProjectForm();refreshAll();
}

function editProject(i){
let p=projects[i];
editProjectIndex.value=i;clientName.value=p.client||"";projectAddress.value=p.address||"";phone.value=p.phone||"";email.value=p.email||"";quoteRef.value=p.ref||"";projectDate.value=p.date||"";projectStatus.value=p.status||"Pending";
showPage("projectPage");
}

function clearProjectForm(){
editProjectIndex.value="";clientName.value="";projectAddress.value="";phone.value="";email.value="";quoteRef.value="";projectDate.value="";projectStatus.value="Pending";
}

function deleteProject(i){
if(confirm("Delete project?")){projects.splice(i,1);localStorage.setItem("projects",JSON.stringify(projects));refreshAll();}
}

function savePriceItem(){
let i=editPriceIndex.value;
let obj={category:priceCategory.value,desc:priceDesc.value,unit:priceUnit.value,rate:parseFloat(priceRate.value)||0};
i===""?prices.push(obj):prices[i]=obj;
localStorage.setItem("prices",JSON.stringify(prices));
clearPriceForm();refreshAll();
}

function editPriceItem(i){
let p=prices[i];
editPriceIndex.value=i;priceCategory.value=p.category||"";priceDesc.value=p.desc||"";priceUnit.value=p.unit||"";priceRate.value=p.rate||0;
showPage("pricePage");
}

function clearPriceForm(){
editPriceIndex.value="";priceCategory.value="";priceDesc.value="";priceUnit.value="";priceRate.value="";
}

function deletePriceItem(i){
if(confirm("Delete price item?")){prices.splice(i,1);localStorage.setItem("prices",JSON.stringify(prices));refreshAll();}
}

function addQuoteItem(){
let item=prices[quoteItem.value];
if(!item){alert("Add price item first");return;}
let qty=parseFloat(quoteQty.value)||0;
currentQuoteItems.push({desc:item.desc,unit:item.unit,qty:qty,rate:item.rate,amount:qty*item.rate});
quoteQty.value="";
loadQuoteTable();
}

function loadQuoteTable(){
let total=0;
quoteTable.innerHTML=currentQuoteItems.map((it,i)=>{
total+=it.amount;
return `<tr><td>${i+1}</td><td>${it.desc}</td><td>${it.unit}</td><td>${it.qty}</td><td>${money(it.rate)}</td><td>${money(it.amount)}</td></tr>`;
}).join("");
grandTotalText.innerText=money(total);
}

function saveQuotation(){
if(currentQuoteItems.length===0){alert("No quotation item");return;}
let p=projects[quoteProject.value];
if(!p){alert("Select project");return;}
let total=currentQuoteItems.reduce((s,i)=>s+i.amount,0);
let qNo="Q-"+String(quotations.length+1).padStart(3,"0");
quotations.push({quoteNo:qNo,project:p,items:[...currentQuoteItems],total:total,date:new Date().toLocaleDateString(),revision:0});
localStorage.setItem("quotations",JSON.stringify(quotations));
currentQuoteItems=[];
loadQuoteTable();
refreshAll();
}

function clearCurrentQuote(){
currentQuoteItems=[];
loadQuoteTable();
}

function loadSavedQuotation(){
loadedQuoteIndex=parseInt(savedQuoteSelect.value);
let q=quotations[loadedQuoteIndex];
if(!q){return;}
loadedQuoteItems=JSON.parse(JSON.stringify(q.items||[]));
renderLoadedQuotation();
}

function renderLoadedQuotation(){
let q=quotations[loadedQuoteIndex];
if(!q){return;}
let total=0;
editQuoteInfo.innerHTML=`<b>${q.quoteNo}</b><br>Client: ${q.project?.client||""}<br>Ref: ${q.project?.ref||""}<br>Revision: ${q.revision||0}`;
editQuoteTable.innerHTML=loadedQuoteItems.map((it,i)=>{
let amt=(Number(it.qty)||0)*(Number(it.rate)||0);
total+=amt;
return `<tr>
<td>${i+1}</td>
<td><textarea onchange="editLine(${i},'desc',this.value)">${it.desc||""}</textarea></td>
<td><input value="${it.unit||""}" onchange="editLine(${i},'unit',this.value)"></td>
<td><input type="number" value="${it.qty||0}" onchange="editLine(${i},'qty',this.value)"></td>
<td><input type="number" value="${it.rate||0}" onchange="editLine(${i},'rate',this.value)"></td>
<td>${money(amt)}</td>
<td><button class="redBtn" onclick="removeQuoteLine(${i})">Omit</button></td>
</tr>`;
}).join("");
editQuoteTotal.innerText=money(total);
}

function editLine(i,field,value){
if(field==="qty"||field==="rate"){value=parseFloat(value)||0;}
loadedQuoteItems[i][field]=value;
renderLoadedQuotation();
}

function removeQuoteLine(i){
if(confirm("Omit item?")){loadedQuoteItems.splice(i,1);renderLoadedQuotation();}
}

function addItemToSavedQuote(){
if(loadedQuoteIndex===null){alert("Load quotation first");return;}
let item=prices[editAddItem.value];
if(!item){return;}
let qty=parseFloat(editAddQty.value)||0;
loadedQuoteItems.push({desc:item.desc,unit:item.unit,qty:qty,rate:item.rate,amount:qty*item.rate});
editAddQty.value="";
renderLoadedQuotation();
}

function updateSavedQuotation(){
if(loadedQuoteIndex===null){return;}
let total=loadedQuoteItems.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.rate)||0),0);
quotations[loadedQuoteIndex].items=JSON.parse(JSON.stringify(loadedQuoteItems));
quotations[loadedQuoteIndex].total=total;
quotations[loadedQuoteIndex].revision=(Number(quotations[loadedQuoteIndex].revision)||0)+1;
quotations[loadedQuoteIndex].updatedDate=new Date().toLocaleDateString();
localStorage.setItem("quotations",JSON.stringify(quotations));
refreshAll();
renderLoadedQuotation();
}

function deleteLoadedQuotation(){
if(loadedQuoteIndex===null){return;}
if(confirm("Delete quotation?")){
quotations.splice(loadedQuoteIndex,1);
localStorage.setItem("quotations",JSON.stringify(quotations));
loadedQuoteIndex=null;loadedQuoteItems=[];
editQuoteInfo.innerHTML="Select and load a quotation.";
editQuoteTable.innerHTML="";
editQuoteTotal.innerText="0.00";
refreshAll();
}
}

function generateInvoices(){
let q=quotations[invoiceQuotation.value];
if(!q){alert("No quotation selected");return;}
if(invoices.some(inv=>inv.quoteNo===q.quoteNo)){alert("Invoices already generated");return;}
[{stage:"INV-1",percent:30},{stage:"INV-2",percent:40},{stage:"INV-3",percent:25},{stage:"INV-4",percent:5}].forEach(s=>{
let amount=q.total*s.percent/100;
invoices.push({invoiceNo:s.stage+"-"+String(invoices.length+1).padStart(3,"0"),quoteNo:q.quoteNo,client:q.project?.client||"",projectRef:q.project?.ref||"",stage:s.stage,percent:s.percent,amount:amount,paid:0,balance:amount,status:"Pending",date:new Date().toLocaleDateString()});
});
localStorage.setItem("invoices",JSON.stringify(invoices));
refreshAll();
}

function saveReceipt(){
let inv=invoices[receiptInvoice.value];
if(!inv){return;}
let paid=parseFloat(receiptAmount.value)||0;
if(paid<=0){alert("Enter paid amount");return;}
let receiptNo="RCPT-"+String(receipts.length+1).padStart(3,"0");
inv.paid=(Number(inv.paid)||0)+paid;
inv.balance=Math.max(0,(Number(inv.amount)||0)-inv.paid);
inv.status=inv.balance<=0?"Paid":"Partial";
receipts.push({receiptNo:receiptNo,invoiceNo:inv.invoiceNo,client:inv.client,amount:paid,date:receiptDate.value||new Date().toLocaleDateString(),method:paymentMethod.value,balance:inv.balance});
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("receipts",JSON.stringify(receipts));
receiptAmount.value="";
refreshAll();
}

function refitDocHeader(title,meta){
preparePrintBase();
printDocTitle.innerHTML=`<div style="letter-spacing:8px;text-transform:lowercase;font-size:26px;">${title}</div>`;
printCompany.innerHTML=`${companyHeader()}<div style="text-align:right;font-size:12px;margin-top:8px;">${meta}</div>`;
}

function printQuotationDoc(q){
let total=Number(q.total)||0;
refitDocHeader("q u o t a t i o n",`quotation no : ${q.quoteNo||""}<br>date : ${q.updatedDate||q.date||new Date().toLocaleDateString()}`);
printInfo.innerHTML=`<b>attention to</b><br>${q.project?.client||""}<br>${q.project?.address||""}<br><br><b>Job Title</b><br>${q.project?.ref||""}`;
printTableArea.innerHTML=`<table><thead><tr><th>no</th><th>description</th><th>unit</th><th>qty</th><th>rate</th><th>amount(RM)</th></tr></thead><tbody>${(q.items||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${it.desc||""}</td><td>${it.unit||""}</td><td>${it.qty||0}</td><td>${money(it.rate)}</td><td>${money((Number(it.qty)||0)*(Number(it.rate)||0))}</td></tr>`).join("")}</tbody></table>`;
printTotal.innerHTML=`TOTAL RENOVATION WORKS : RM${money(total)}`;
printTerms.innerHTML=`<b>terms and condition:</b><br>~ payment 30% upon confirmation. Progress claim 65% and balance 5% after completion.<br>~ prices valid for 30 working days from date of quotation<br>~ warranty / defects liability period 12 mths upon site handover<br>~ goods sold are not returnable or exchangeable<br><br>All cheques / or bank transfer should be payable to :-<br><b>${company.bank?company.bank.replace(/\n/g,"<br>"):""}</b><br><br>I/we hereby confirm & accept the above quotation in full<br><br>customer name : ___________________________<br>customer i/c or company chop n sign : ___________________________<br><br>Yours sincerely,<br>FOR . ${company.name||"REFIT MAINTENANCE SERVICES"}`;
window.print();
}

function printCurrentQuotation(){
let p=projects[quoteProject.value];
if(!p||currentQuoteItems.length===0){alert("Select project and add item");return;}
let total=currentQuoteItems.reduce((s,i)=>s+i.amount,0);
printQuotationDoc({quoteNo:"DRAFT",project:p,items:currentQuoteItems,total:total,date:new Date().toLocaleDateString()});
}

function printLoadedQuotation(){
if(loadedQuoteIndex===null){return;}
let q=JSON.parse(JSON.stringify(quotations[loadedQuoteIndex]));
q.items=loadedQuoteItems;
q.total=loadedQuoteItems.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.rate)||0),0);
printQuotationDoc(q);
}

function printSelectedInvoice(){
let inv=invoices[printInvoiceSelect.value];
if(!inv){return;}
refitDocHeader("i n v o i c e",`invoice no : ${inv.invoiceNo}<br>quotation no : ${inv.quoteNo}<br>date : ${inv.date}`);
printInfo.innerHTML=`<b>attention to</b><br>${inv.client}<br><br><b>Job Title</b><br>project renovation work ${inv.projectRef||""}`;

printTotal.innerHTML=`${inv.stage} PROGRESS CLAIM : RM ${money(inv.amount)}<br>BALANCE : RM ${money(inv.balance)}`;
printTerms.innerHTML=`All cheques / or bank transfers should be payable to <b>${company.name||"REFIT MAINTENANCE SERVICES"}</b><br>${company.bank?company.bank.replace(/\n/g,"<br>"):""}<br><br>Yours sincerely,<br>FOR . ${company.name||"REFIT MAINTENANCE SERVICES"}`;
window.print();

let r=receipts[printReceiptSelect.value];

refitDocHeader("o f f i c i a l  r e c e i p t",`receipt no : ${r.receiptNo}<br>inv no : ${r.invoiceNo}<br>date : ${r.date}`);
printInfo.innerHTML=`<b>attention to</b><br>${r.client}<br><br><b>PAID FOR PROGRESS CLAIM</b><br>${r.invoiceNo}<br><br><b>PAYMENT BY CHEQUE NO / TRANSFER FROM / SLIP NO:</b><br>${r.method}`;

printTotal.innerHTML=`RECEIVED THE SUM OF : RINGGIT MALAYSIA RM ${money(r.amount)}`;
printTerms.innerHTML=`N.B. VALIDITY OF THIS RECEIPT SUBJECT TO CLEARING OF TRANSFER<br><br>Yours sincerely,<br>FOR . ${company.name||"REFIT MAINTENANCE SERVICES"}`;

function exportBackup(){
let data={company,projects,prices,quotations,invoices,receipts};
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="refitmaster_backup.json";
a.click();
}

function importBackup(){
let file=importFile.files[0];
if(!file){return;}
let reader=new FileReader();
reader.onload=function(e){
let d=JSON.parse(e.target.result);
company=d.company||company;projects=d.projects||[];prices=d.prices||[];quotations=d.quotations||[];invoices=d.invoices||[];receipts=d.receipts||[];
localStorage.setItem("company",JSON.stringify(company));
localStorage.setItem("projects",JSON.stringify(projects));
localStorage.setItem("prices",JSON.stringify(prices));
localStorage.setItem("quotations",JSON.stringify(quotations));
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("receipts",JSON.stringify(receipts));
refreshAll();
};
reader.readAsText(file);
}

function clearAllData(){
if(confirm("DELETE ALL DATA?")){localStorage.clear();location.reload();}
}

function refreshAll(){
projectCount.innerText=projects.length;
priceCount.innerText=prices.length;
quoteCount.innerText=quotations.length;
invoiceCount.innerText=invoices.length;
receiptCount.innerText=receipts.length;

loadCompanyForm();

companyPreview.innerHTML=`<div class="itemBox">${companyHeader()}<br><br><b>Bank:</b><br>${(company.bank||"").replace(/\n/g,"<br>")}<br><br><b>Authorized:</b> ${company.sign||""}</div>`;

projectList.innerHTML=projects.map((p,i)=>`<div class="itemBox"><b>${p.client}</b><br>${p.address}<br>Ref: ${p.ref}<br>Status: ${p.status}<br><button class="blueBtn" onclick="editProject(${i})">Edit</button><button class="redBtn" onclick="deleteProject(${i})">Delete</button></div>`).join("");

invoiceQuotation.innerHTML=quotations.map((q,i)=>`<option value="${i}">${q.quoteNo} - ${q.project?.client||""} - RM ${money(q.total)}</option>`).join("");

receiptInvoice.innerHTML=invoices.map((inv,i)=>`<option value="${i}">${inv.invoiceNo} - ${inv.client} - Balance RM ${money(inv.balance)} - ${inv.status}</option>`).join("");
