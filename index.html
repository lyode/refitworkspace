<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REFIT MASTER</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#e9edf2;
}

.header{
    background:#0b57a4;
    color:white;
    text-align:center;
    padding:20px;
    font-size:50px;
    font-weight:bold;
}

.container{
    padding:15px;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.menu button{
    background:#0b57a4;
    color:white;
    border:none;
    padding:18px;
    font-size:24px;
    border-radius:10px;
    cursor:pointer;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.count{
    font-size:55px;
    font-weight:bold;
}

.hidden{
    display:none;
}

input, textarea, select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    font-size:18px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.saveBtn{
    background:green;
    color:white;
    border:none;
    padding:15px;
    width:100%;
    font-size:22px;
    border-radius:10px;
}

.projectItem{
    background:#f5f5f5;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
}

.title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="header">
REFIT MASTER
</div>

<div class="container">

<div class="menu">
<button onclick="showDashboard()">Dashboard</button>
<button onclick="showProject()">Project</button>
<button onclick="showPrice()">Price Master</button>
<button onclick="showQuotation()">Quotation</button>
</div>

<!-- DASHBOARD -->

<div id="dashboardPage">

<div class="card">
<h2>Total Projects</h2>
<div class="count" id="projectCount">0</div>
</div>

<div class="card">
<h2>Total Price Items</h2>
<div class="count">0</div>
</div>

</div>

<!-- PROJECT PAGE -->

<div id="projectPage" class="hidden">

<div class="card">

<div class="title">
Project Registration
</div>

<input type="text" id="clientName" placeholder="Client Name">

<textarea id="projectAddress" placeholder="Project Address"></textarea>

<input type="text" id="phone" placeholder="Phone Number">

<input type="email" id="email" placeholder="Email">

<input type="text" id="quoteRef" placeholder="Quote Ref No">

<input type="date" id="projectDate">

<select id="projectStatus">
<option>Pending</option>
<option>Quotation Sent</option>
<option>Confirmed</option>
<option>Completed</option>
</select>

<button class="saveBtn" onclick="saveProject()">
Save Project
</button>

</div>

<div class="card">

<div class="title">
Project List
</div>

<div id="projectList"></div>

</div>

</div>

<!-- PRICE PAGE -->

<div id="pricePage" class="hidden">

<div class="card">
<h2>Price Master Coming Soon</h2>
</div>

</div>

<!-- QUOTATION PAGE -->

<div id="quotationPage" class="hidden">

<div class="card">
<h2>Quotation Module Coming Soon</h2>
</div>

</div>

</div>

<script>

let projects = JSON.parse(localStorage.getItem("projects")) || [];

function showDashboard(){
    hideAll();
    document.getElementById("dashboardPage").classList.remove("hidden");
}

function showProject(){
    hideAll();
    document.getElementById("projectPage").classList.remove("hidden");
}

function showPrice(){
    hideAll();
    document.getElementById("pricePage").classList.remove("hidden");
}

function showQuotation(){
    hideAll();
    document.getElementById("quotationPage").classList.remove("hidden");
}

function hideAll(){
    document.getElementById("dashboardPage").classList.add("hidden");
    document.getElementById("projectPage").classList.add("hidden");
    document.getElementById("pricePage").classList.add("hidden");
    document.getElementById("quotationPage").classList.add("hidden");
}

function saveProject(){

    let project = {
        client: document.getElementById("clientName").value,
        address: document.getElementById("projectAddress").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        ref: document.getElementById("quoteRef").value,
        date: document.getElementById("projectDate").value,
        status: document.getElementById("projectStatus").value
    };

    projects.push(project);

    localStorage.setItem("projects", JSON.stringify(projects));

    loadProjects();

    alert("Project Saved Successfully");

    clearForm();
}

function loadProjects(){

    document.getElementById("projectCount").innerText = projects.length;

    let html = "";

    projects.forEach((p,index)=>{

        html += `
        <div class="projectItem">
            <b>${p.client}</b><br>
            ${p.address}<br><br>
            Ref: ${p.ref}<br>
            Status: ${p.status}
        </div>
        `;

    });

    document.getElementById("projectList").innerHTML = html;

}

function clearForm(){

    document.getElementById("clientName").value = "";
    document.getElementById("projectAddress").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("email").value = "";
    document.getElementById("quoteRef").value = "";
    document.getElementById("projectDate").value = "";

}

loadProjects();

</script>

</body>
</html>
